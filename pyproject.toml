[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2-from-scratch"
version = "0.1.0"
description = "An educational implementation of GPT-2 components in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.0", "einops>=0.8", "numpy>=1.24", "fancy-einsum>=0.0.3"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pyright>=1.1.400", "pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Match the active interpreter and its installed dependency stubs.
files = ["src", "examples", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pyright]
include = ["src", "examples", "tests"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
