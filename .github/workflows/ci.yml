name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - name: Install CPU dependencies and project
        run: |
          python -m venv .venv
          source .venv/bin/activate
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements/constraints.txt -e '.[dev]'
          python -m pip check
      - name: Check formatting, types, and tests
        run: make check
      - name: Run example
        run: make example
      - name: Build distributions
        run: make build
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip uninstall -y gpt2-from-scratch
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/examples/attention.py"
