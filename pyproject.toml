[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2-from-scratch"
version = "0.1.0"
description = "Implementing a GPT-2-style Transformers from scratch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["torch>=2.0", "einops>=0.8", "numpy>=2.5", "fancy-einsum>=0.0.3"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
